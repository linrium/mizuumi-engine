# Local evaluation values for the upstream NVIDIA OpenShell chart.
# The setup script pins the chart version separately.

replicaCount: 1

workload:
  kind: statefulset

server:
  telemetryEnabled: false
  auth:
    allowUnauthenticatedUsers: false
  oidc:
    issuer: https://auth.mizuumi.test/realms/sovico
    audience: openshell-cli
    caConfigMapName: openshell-keycloak-ca
    rolesClaim: realm_access.roles
    adminRole: openshell-admin
    userRole: openshell-user

networkPolicy:
  enabled: true

service:
  type: ClusterIP

sandbox:
  image:
    repository: nvcr.io/nvidia/base/ubuntu
    tag: "24.04"
