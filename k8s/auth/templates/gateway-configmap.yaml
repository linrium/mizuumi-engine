{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.name" . }}-gateway
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  Caddyfile: |
    {
      admin off
      auto_https off
      log default {
        level ERROR
      }
    }

    https://{{ trimPrefix "https://" .Values.keycloak.hostname }}:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      reverse_proxy https://{{ include "keycloak.name" . }}:{{ .Values.service.port }} {
        # Never pass client-supplied forwarding metadata to Keycloak.
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
        transport http {
          tls_trust_pool file /etc/caddy/upstream-cas/ca.crt
          tls_server_name {{ include "keycloak.name" . }}.{{ .Release.Namespace }}.svc.cluster.local
        }
      }
    }

    https://vault.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      @vault_metrics path /v1/sys/metrics
      respond @vault_metrics 404
      reverse_proxy https://vault.vault.svc.cluster.local:8200 {
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
        transport http {
          tls_trust_pool file /etc/caddy/upstream-cas/ca.crt
          tls_server_name vault.vault.svc.cluster.local
        }
      }
    }

    https://storage.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      handle /rustfs/console/* {
        reverse_proxy https://rustfs-svc.storage.svc.cluster.local:9001 {
          header_up Host {host}
          header_up -Forwarded
          header_up X-Forwarded-For {http.request.remote.host}
          header_up X-Forwarded-Host {host}
          header_up X-Forwarded-Port 443
          header_up X-Forwarded-Proto https
          transport http {
            tls_trust_pool file /etc/caddy/upstream-cas/ca.crt
            tls_server_name rustfs-svc.storage.svc.cluster.local
          }
        }
      }
      # The console signs same-origin Admin and S3 requests. Send every
      # non-console path directly to the API listener without changing Host.
      handle {
        reverse_proxy https://rustfs-svc.storage.svc.cluster.local:9000 {
          header_up Host {host}
          header_up -Forwarded
          header_up X-Forwarded-For {http.request.remote.host}
          header_up X-Forwarded-Host {host}
          header_up X-Forwarded-Port 443
          header_up X-Forwarded-Proto https
          transport http {
            tls_trust_pool file /etc/caddy/upstream-cas/ca.crt
            tls_server_name rustfs-svc.storage.svc.cluster.local
          }
        }
      }
    }

    https://api.storage.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      reverse_proxy https://rustfs-svc.storage.svc.cluster.local:9000 {
        header_up Host {host}
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
        transport http {
          tls_trust_pool file /etc/caddy/upstream-cas/ca.crt
          tls_server_name rustfs-svc.storage.svc.cluster.local
        }
      }
    }

    https://unitycatalog.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      reverse_proxy http://unitycatalog-server.tower.svc.cluster.local:8080 {
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
      }
    }

    https://api.redpanda.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      reverse_proxy http://redpanda.redpanda.svc.cluster.local:8082 {
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
      }
    }

    https://console.redpanda.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      reverse_proxy http://redpanda-console.redpanda.svc.cluster.local:8080 {
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
      }
    }

    https://console.signoz.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      reverse_proxy http://signoz.signoz.svc.cluster.local:8080 {
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
      }
    }

    https://api.chronicle.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      reverse_proxy http://chronicle.chronicle.svc.cluster.local {
        header_up -Forwarded
        header_up X-Forwarded-For {http.request.remote.host}
        header_up X-Forwarded-Host {host}
        header_up X-Forwarded-Port 443
        header_up X-Forwarded-Proto https
      }
    }

    https://otlp.signoz.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key
      route {
        # Serve OTLP/gRPC and OTLP/HTTP on the same public HTTPS endpoint.
        @grpc header Content-Type application/grpc*
        reverse_proxy @grpc h2c://signoz-otel-collector.signoz.svc.cluster.local:4317
        reverse_proxy http://signoz-otel-collector.signoz.svc.cluster.local:4318
      }
    }

{{- if .Values.gateway.openshell.enabled }}
    https://openshell.mizuumi.test:8443 {
      tls /etc/caddy/gateway-tls/tls.crt /etc/caddy/gateway-tls/tls.key {
        client_auth {
          mode require_and_verify
          trust_pool file /etc/caddy/openshell-client-tls/ca.crt
        }
      }
      reverse_proxy https://{{ .Values.gateway.openshell.serviceName }}.{{ .Values.gateway.openshell.namespace }}.svc.cluster.local:8080 {
        transport http {
          tls_client_auth /etc/caddy/openshell-client-tls/tls.crt /etc/caddy/openshell-client-tls/tls.key
          tls_trust_pool file /etc/caddy/openshell-client-tls/ca.crt
          tls_server_name {{ .Values.gateway.openshell.serviceName }}.{{ .Values.gateway.openshell.namespace }}.svc.cluster.local
        }
      }
    }
{{- end }}
{{- end }}
