apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synthetics.fullname" . }}
  labels:
    {{- include "synthetics.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "synthetics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synthetics.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "synthetics.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: synthetics
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: REDPANDA_BROKERS
              value: {{ .Values.redpanda.brokers | quote }}
            - name: REDPANDA_CLIENT_ID
              value: {{ .Values.redpanda.clientId | quote }}
            - name: REDPANDA_TLS
              value: {{ .Values.redpanda.tls | quote }}
            - name: REDPANDA_TOPIC_VN_HDBANK
              value: {{ .Values.redpanda.topics.vn.hdbank | quote }}
            - name: REDPANDA_TOPIC_VN_VIKKI
              value: {{ .Values.redpanda.topics.vn.vikki | quote }}
            - name: REDPANDA_TOPIC_VN_VIETJETAIR
              value: {{ .Values.redpanda.topics.vn.vietjetAir | quote }}
            - name: REDPANDA_TOPIC_VN_CRM
              value: {{ .Values.redpanda.topics.vn.crm | quote }}
            - name: REDPANDA_TOPIC_TH_HDBANK
              value: {{ .Values.redpanda.topics.th.hdbank | quote }}
            - name: REDPANDA_TOPIC_TH_VIKKI
              value: {{ .Values.redpanda.topics.th.vikki | quote }}
            - name: REDPANDA_TOPIC_TH_VIETJETAIR
              value: {{ .Values.redpanda.topics.th.vietjetAir | quote }}
            - name: REDPANDA_TOPIC_TH_CRM
              value: {{ .Values.redpanda.topics.th.crm | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.redpanda.saslSecretName }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/synthetics
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
