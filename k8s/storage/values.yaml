# Official rustfs/rustfs chart 1.0.0; local single-node installation.
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

secret:
  existingSecret: rustfs-credentials

extraVolumes:
  - name: vault-ca
    secret:
      secretName: rustfs-vault-ca
  - name: rustfs-tls
    secret:
      secretName: rustfs-tls
      defaultMode: 0440
extraVolumeMounts:
  - name: vault-ca
    mountPath: /etc/rustfs/vault-ca
    readOnly: true
  - name: rustfs-tls
    mountPath: /etc/rustfs/tls
    readOnly: true

storageclass:
  name: standard
  dataStorageSize: 8Gi
  logStorageSize: 1Gi

ingress:
  enabled: false

serviceAccount:
  automount: false

config:
  rustfs:
    obs_environment: development
    obs_endpoint:
      enabled: true
      base_endpoint: http://signoz-k8s-infra-otel-agent.signoz-infra.svc.cluster.local:4318
      use_stdout: false
      metrics:
        enabled: true
        endpoint: ""
      trace:
        enabled: true
        endpoint: ""
      logs:
        enabled: true
        endpoint: ""
      profiling:
        enabled: false
        endpoint: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

# The confidential client secret is read from rustfs-credentials via envFrom.
# The callback is on the API port (9000); the Console runs on port 9001.
extraEnv:
  - name: K8S_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: K8S_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: service.namespace=storage,deployment.environment=local,k8s.cluster.name=docker-desktop,k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME)
  - name: RUSTFS_OBS_SERVICE_NAME
    value: rustfs
  - name: RUSTFS_OBS_METRICS_EXPORT_ENABLED
    value: "true"
  - name: RUSTFS_OBS_TRACES_EXPORT_ENABLED
    value: "true"
  - name: RUSTFS_OBS_LOGS_EXPORT_ENABLED
    value: "true"
  - name: RUSTFS_OBS_LOG_STDOUT_ENABLED
    value: "true"
  - name: RUSTFS_OBS_SAMPLE_RATIO
    value: "1.0"
  - name: RUSTFS_OBS_METER_INTERVAL
    value: "60"
  - name: RUSTFS_OBS_LOGGER_LEVEL
    value: info
  - name: RUSTFS_TLS_PATH
    value: /etc/rustfs/tls
  - name: SSL_CERT_FILE
    value: /etc/rustfs/vault-ca/ca.crt
  - name: RUSTFS_EXTRA_CA_CERT
    value: /etc/rustfs/vault-ca/ca.crt
  - name: RUSTFS_KMS_VAULT_CA_CERT
    value: /etc/rustfs/vault-ca/ca.crt
  - name: RUSTFS_BROWSER_REDIRECT_URL
    value: https://storage.mizuumi.test
  - name: RUSTFS_IDENTITY_OPENID_ENABLE
    value: "on"
  - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
    value: https://auth.mizuumi.test/realms/sovico
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
    value: rustfs-console
  - name: RUSTFS_IDENTITY_OPENID_SCOPES
    value: openid,profile,email
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
    value: https://api.storage.mizuumi.test/rustfs/admin/v3/oidc/callback/default
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
    value: "off"
  - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
    value: Keycloak
  - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
    value: groups
  - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
    value: preferred_username
  - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS
    value: https://auth.mizuumi.test
