apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unitycatalog.serverName" . }}
  labels:
    {{- include "unitycatalog.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "unitycatalog.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "unitycatalog.serverSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      initContainers:
        - name: render-config
          image: busybox:1.37.0
          command: ["sh", "-ec"]
          args:
            - |-
              cp /templates/* /config/
              printf '\nserver.client-id=%s\nserver.client-secret=%s\n' "$OAUTH_CLIENT_ID" "$OAUTH_CLIENT_SECRET" >> /config/server.properties
              printf 's3.accessKey.0=%s\ns3.secretKey.0=%s\n' "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >> /config/server.properties
          env:
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.credentialsSecretName | quote }}
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.credentialsSecretName | quote }}
                  key: OAUTH_CLIENT_SECRET
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.credentialsSecretName | quote }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.credentialsSecretName | quote }}
                  key: S3_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config-template
              mountPath: /templates
              readOnly: true
            - name: rendered-config
              mountPath: /config
        - name: build-truststore
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |-
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              keytool -importcert -noprompt -storepass changeit -keystore /truststore/cacerts -alias mizuumi-keycloak -file /local-cas/keycloak-ca.crt
              keytool -importcert -noprompt -storepass changeit -keystore /truststore/cacerts -alias mizuumi-rustfs -file /local-cas/rustfs-ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: local-cas
              mountPath: /local-cas
              readOnly: true
            - name: truststore
              mountPath: /truststore
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.server.containerSecurityContext | nindent 12 }}
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/home/unitycatalog/etc/truststore/cacerts
                -Djavax.net.ssl.trustStorePassword=changeit
                -Daws.endpointUrl.s3={{ .Values.server.rustfs.endpoint }}
                -Daws.endpointUrl.sts={{ .Values.server.rustfs.endpoint }}
                -Daws.s3.forcePathStyle=true
            - name: AWS_ENDPOINT_URL_S3
              value: {{ .Values.server.rustfs.endpoint | quote }}
            - name: AWS_ENDPOINT_URL_STS
              value: {{ .Values.server.rustfs.endpoint | quote }}
            - name: AWS_REGION
              value: {{ .Values.server.rustfs.region | quote }}
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.credentialsSecretName | quote }}
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.credentialsSecretName | quote }}
                  key: S3_SECRET_KEY
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: rendered-config
              mountPath: /home/unitycatalog/etc/conf/server.properties
              subPath: server.properties
              readOnly: true
            - name: rendered-config
              mountPath: /home/unitycatalog/etc/conf/hibernate.properties
              subPath: hibernate.properties
              readOnly: true
            - name: rendered-config
              mountPath: /home/unitycatalog/etc/conf/server.log4j2.properties
              subPath: server.log4j2.properties
              readOnly: true
            - name: jwt
              mountPath: /home/unitycatalog/etc/conf/private_key.der
              subPath: private_key.der
              readOnly: true
            - name: jwt
              mountPath: /home/unitycatalog/etc/conf/public_key.der
              subPath: public_key.der
              readOnly: true
            - name: jwt
              mountPath: /home/unitycatalog/etc/conf/key_id.txt
              subPath: key_id.txt
              readOnly: true
            - name: data
              mountPath: /home/unitycatalog/etc/db
            - name: truststore
              mountPath: /home/unitycatalog/etc/truststore
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: {{ include "unitycatalog.serverName" . }}-config
        - name: rendered-config
          emptyDir: {}
        - name: local-cas
          secret:
            secretName: {{ .Values.server.trustSecretName | quote }}
        - name: truststore
          emptyDir: {}
        - name: jwt
          secret:
            secretName: {{ .Values.server.jwt.secretName | quote }}
        - name: data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "unitycatalog.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unitycatalog.serverName" . }}
  labels:
    {{- include "unitycatalog.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "unitycatalog.serverSelectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.server.service.port }}
      targetPort: api
      protocol: TCP
