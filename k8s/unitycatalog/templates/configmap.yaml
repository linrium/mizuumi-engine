apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "unitycatalog.serverName" . }}-config
  labels:
    {{- include "unitycatalog.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = {{ .Values.server.port }}

    [postgres]
    host = {{ include "unitycatalog.postgresqlHost" . | quote }}
    port = {{ include "unitycatalog.postgresqlPort" . }}
    user = {{ include "unitycatalog.postgresqlUsername" . | quote }}
    password = ""
    database = {{ include "unitycatalog.postgresqlDatabase" . | quote }}
    pool_size = 16

    [vending]
    endpoint_url = {{ .Values.vending.endpointUrl | quote }}
    region = {{ .Values.vending.region | quote }}
    access_key = ""
    secret_key = ""
    duration_seconds = {{ .Values.vending.durationSeconds }}
    force_path_style = {{ .Values.vending.forcePathStyle }}
