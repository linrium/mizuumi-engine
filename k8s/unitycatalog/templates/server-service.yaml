apiVersion: v1
kind: Service
metadata:
  name: {{ include "unitycatalog.serverName" . }}
  labels:
    {{- include "unitycatalog.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "unitycatalog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
