nameOverride: ""
fullnameOverride: ""

server:
  image:
    repository: unitycatalog/unitycatalog
    tag: "v0.6.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  jwt:
    # Created by scripts/setup_unitycatalog.sh unless it already exists.
    secretName: unitycatalog-jwt
  credentialsSecretName: unitycatalog-credentials
  trustSecretName: unitycatalog-trust
  modelStorageRoot: s3://unitycatalog/models
  auth:
    enabled: true
    authorizationUrl: https://auth.mizuumi.test/realms/sovico/protocol/openid-connect/auth
    tokenUrl: https://auth.mizuumi.test/realms/sovico/protocol/openid-connect/token
    allowedIssuers: https://auth.mizuumi.test/realms/sovico
    audiences: unitycatalog
    cookieTimeout: P5D
    accessTokenTimeout: PT24H
  rustfs:
    bucket: unitycatalog
    region: us-east-1
    endpoint: https://rustfs-svc.storage.svc.cluster.local:9000
    roleArn: arn:aws:iam::000000000000:role/unitycatalog
  extraProperties: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

ingress:
  # The quickstart configuration has authorization disabled. Do not expose it
  # to an untrusted network without first adding an authentication design.
  enabled: false
  className: ""
  annotations: {}
  host: uc.mizuumi.test
  tls:
    enabled: false
    secretName: ""
