apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronicle-ui.name" . }}
  labels:
    {{- include "chronicle-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: chronicle-ui
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "chronicle-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chronicle-ui
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
