image:
  repository: docker.io/redpandadata/redpanda
  tag: v24.3.2

statefulset:
  replicas: 1
  sideCars:
    controllers:
      image:
        repository: docker.io/redpandadata/redpanda-operator
        tag: v2.3.4-24.3.2

tls:
  enabled: false

auth:
  sasl:
    enabled: false

external:
  enabled: true
  # Docker Desktop k8s only exposes Services of type LoadBalancer on the host's
  # localhost (via its vpnkit tunnel). NodePorts don't bind to 127.0.0.1 there,
  # so clients outside the cluster can't reach them.
  type: LoadBalancer
  # The chart advertises external listeners as `<pod>.<external.domain>:<port>`.
  # /etc/hosts resolves this subdomain to 127.0.0.1, which Docker Desktop then
  # forwards into the LoadBalancer Service.
  domain: api.redpanda.mizuumi.test

listeners:
  kafka:
    port: 9092
    authenticationMethod: none
    advertisedPorts:
      - 9092
    external:
      default:
        port: 30092
        advertisedPorts:
          - 30092
    tls:
      enabled: false
  admin:
    port: 9644
    authenticationMethod: none
  http:
    enabled: true
    port: 8082
    authenticationMethod: none
  schemaRegistry:
    enabled: true
    port: 8081
    authenticationMethod: none
  rpc:
    port: 33145

storage:
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: standard

resources:
  cpu:
    cores: 1
    overprovisioned: true
  memory:
    enable_memory_locking: false
    container:
      max: 1536Mi

config:
  cluster:
    auto_create_topics_enabled: true

console:
  enabled: true
  image:
    registry: docker.io
    repository: redpandadata/console
    tag: v2.7.2
  console:
    config:
      kafka:
        brokers:
          - redpanda-0.redpanda.redpanda.svc.cluster.local:9092
        schemaRegistry:
          enabled: true
          urls:
            - http://redpanda.redpanda.svc.cluster.local:8081
      redpanda:
        adminApi:
          enabled: true
          urls:
            - http://redpanda.redpanda.svc.cluster.local:9644
  ingress:
    enabled: false
    className: ""
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
