spark:
  dependenciesPath: /opt/spark/dependencies/0.6.0/*
  extraSparkConf:
    spark.sql.streaming.schemaInference: "true"

flare:
  enabled: true
  driverServiceName: t24-payment-events-bronze-driver
  executorServiceName: t24-payment-events-bronze-executor
  # A continuously running query can create unbounded task and stage spans.
  # Job-level tracing retains micro-batch latency while Flare still exports
  # stage and task aggregate metrics.
  traceGranularity: jobs

application:
  restartPolicy:
    type: Always
  driver:
    cores: 1
    coreLimit: 1500m
    memory: 1500m
  executor:
    instances: 1
    cores: 1
    coreLimit: 1500m
    memory: 1500m
