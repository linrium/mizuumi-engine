spark:
  dependenciesPath: /opt/spark/dependencies/0.6.0/*
  extraSparkConf:
    spark.sql.streaming.schemaInference: "true"

application:
  restartPolicy:
    type: Always
  driver:
    cores: 1
    coreLimit: 1500m
    memory: 1500m
  executor:
    instances: 1
    cores: 1
    coreLimit: 1500m
    memory: 1500m
