image:
  repository: mizuumi/spark
  tag: "4.0.1-uc-kafka-rustfs-baked"
  pullPolicy: Always

serviceAccountName: spark-operator-spark
credentialsSecretName: spark-runtime-credentials
trustSecretName: spark-rustfs-trust

keycloak:
  tokenUrl: https://auth.mizuumi.test/realms/sovico/protocol/openid-connect/token
  caCertificatePath: /opt/spark/trust/keycloak-ca.crt

spark:
  version: "4.0.1"
  scalaVersion: "2.13"
  dependenciesPath: /opt/spark/dependencies/0.5.0/*
  catalog:
    name: unity
    uri: http://unitycatalog-server.tower.svc.cluster.local:8080
    storageRoot: s3://unitycatalog/spark
  s3:
    endpoint: https://rustfs-svc.storage.svc.cluster.local:9000
    region: us-east-1
  extraSparkConf: {}
  deps: {}

application:
  enabled: true
  name: unity-catalog-rustfs
  mainApplicationFile: local:///opt/spark/work-dir/application/main.py
  scriptConfigMap: ""
  scriptMountPath: ""
  scriptRevision: ""
  artifact:
    enabled: false
    urlSecretName: ""
    mountPath: /opt/spark/work-dir/application
    fileName: main.py
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: 1200m
    memory: 1g
  executor:
    instances: 1
    cores: 1
    coreLimit: 1200m
    memory: 1g

resources: {}
