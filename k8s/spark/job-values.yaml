spark:
  dependenciesPath: /opt/spark/dependencies/0.6.0/*

flare:
  enabled: true
  driverServiceName: bronze-to-silver-driver
  executorServiceName: bronze-to-silver-executor
  traceGranularity: jobs

application:
  controlplaneAuth:
    enabled: true
  env:
    CONTROLPLANE_URL: http://controlplane-server.tower.svc.cluster.local:8080
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreRequest: 100m
    coreLimit: 1
    memory: 1g
    memoryOverhead: 512m
  executor:
    instances: 1
    cores: 1
    coreRequest: 100m
    coreLimit: 1
    memory: 1250m
    memoryOverhead: 500m
