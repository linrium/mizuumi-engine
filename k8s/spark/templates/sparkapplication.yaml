{{- if .Values.application.enabled }}
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: {{ .Values.application.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark.labels" . | nindent 4 }}
spec:
  type: Python
  mode: cluster
  pythonVersion: "3"
  sparkVersion: {{ .Values.spark.version | quote }}
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  mainApplicationFile: {{ .Values.application.mainApplicationFile | quote }}
  deps:
    packages:
      {{- toYaml .Values.spark.packages | nindent 6 }}
  sparkConf:
    spark.jars.ivy: /tmp/.ivy2
    spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
    spark.sql.catalog.{{ .Values.spark.catalog.name }}: io.unitycatalog.spark.UCSingleCatalog
    spark.sql.catalog.{{ .Values.spark.catalog.name }}.uri: {{ .Values.spark.catalog.uri | quote }}
    spark.sql.catalog.{{ .Values.spark.catalog.name }}.renewCredential.enabled: "true"
    spark.sql.catalog.{{ .Values.spark.catalog.name }}.credScopedFs.enabled: "true"
    # The local Rust server implements the UC table and temporary-credential
    # APIs, not the newer Delta REST commit API.
    spark.sql.catalog.{{ .Values.spark.catalog.name }}.deltaRestApi.enabled: "false"
    spark.sql.defaultCatalog: {{ .Values.spark.catalog.name | quote }}
    spark.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.endpoint: {{ .Values.spark.s3.endpoint | quote }}
    spark.hadoop.fs.s3a.endpoint.region: {{ .Values.spark.s3.region | quote }}
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "true"
    spark.kubernetes.executor.deleteOnTermination: "true"
  restartPolicy:
    {{- toYaml .Values.application.restartPolicy | nindent 4 }}
  volumes:
    - name: rustfs-trust
      secret:
        secretName: {{ .Values.trustSecretName }}
  driver:
    cores: {{ .Values.application.driver.cores }}
    coreLimit: {{ .Values.application.driver.coreLimit | quote }}
    memory: {{ .Values.application.driver.memory | quote }}
    serviceAccount: {{ .Values.serviceAccountName }}
    javaOptions: >-
      -Djavax.net.ssl.trustStore=/opt/spark/trust/cacerts
      -Djavax.net.ssl.trustStorePassword=changeit
    env:
      - name: UNITY_CATALOG_TOKEN
        valueFrom:
          secretKeyRef:
            name: {{ .Values.credentialsSecretName }}
            key: UNITY_CATALOG_TOKEN
      - name: UNITY_CATALOG_NAME
        valueFrom:
          secretKeyRef:
            name: {{ .Values.credentialsSecretName }}
            key: UNITY_CATALOG_NAME
      - name: UNITY_STORAGE_ROOT
        value: {{ .Values.spark.catalog.storageRoot | quote }}
    volumeMounts:
      - name: rustfs-trust
        mountPath: /opt/spark/trust
        readOnly: true
  executor:
    instances: {{ .Values.application.executor.instances }}
    cores: {{ .Values.application.executor.cores }}
    coreLimit: {{ .Values.application.executor.coreLimit | quote }}
    memory: {{ .Values.application.executor.memory | quote }}
    javaOptions: >-
      -Djavax.net.ssl.trustStore=/opt/spark/trust/cacerts
      -Djavax.net.ssl.trustStorePassword=changeit
    volumeMounts:
      - name: rustfs-trust
        mountPath: /opt/spark/trust
        readOnly: true
{{- end }}
