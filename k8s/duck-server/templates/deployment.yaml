apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duck-server.fullname" . }}
  labels:
    {{- include "duck-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "duck-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "duck-server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "duck-server.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: duck-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: quack
              containerPort: {{ .Values.service.port }}
            - name: query-http
              containerPort: {{ .Values.service.queryPort }}
          env:
            - name: DUCKDB_DATABASE
              value: /var/lib/duckdb/mizuumi.duckdb
            - name: QUACK_LISTEN_URI
              value: quack:0.0.0.0:9494
            - name: QUACK_INTERNAL_URI
              value: quack:127.0.0.1:9494
            - name: S3_ENDPOINT
              value: {{ .Values.rustfs.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.rustfs.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.rustfs.region | quote }}
            - name: S3_CA_FILE
              value: /etc/duck-server/trust/rustfs-ca.crt
            - name: SSL_CERT_FILE
              value: /etc/duck-server/trust/rustfs-ca.crt
            - name: UNITY_CATALOG_ENDPOINT
              value: {{ .Values.unityCatalog.endpoint | quote }}
            - name: UNITY_CATALOGS
              value: {{ .Values.unityCatalog.catalogs | toJson | quote }}
            - name: KEYCLOAK_INTROSPECTION_URL
              value: {{ .Values.unityCatalog.introspectionUrl | quote }}
            - name: KEYCLOAK_CA_CERT
              value: /etc/duck-server/trust/gateway-ca.crt
            - name: QUERY_HTTP_LISTEN
              value: {{ printf "0.0.0.0:%v" .Values.service.queryPort | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.telemetry.exportInterval | quote }}
            - name: OTEL_SERVICE_NAME
              value: duck-server
            - name: OTEL_SERVICE_NAMESPACE
              value: duck-server
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "deployment.environment=%s,k8s.namespace.name=%s,k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID)" .Values.telemetry.deploymentEnvironment .Release.Namespace | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.credentialsSecretName }}
          readinessProbe:
            httpGet:
              path: /health
              port: query-http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: query-http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/duckdb
            - name: trust
              mountPath: /etc/duck-server/trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "duck-server.fullname" . }}
        - name: trust
          secret:
            secretName: {{ .Values.trustSecretName }}
        - name: tmp
          emptyDir: {}
