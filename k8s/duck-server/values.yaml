image:
  repository: mizuumi/duck-server
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

service:
  port: 9494
  queryPort: 9495

persistence:
  size: 5Gi
  storageClassName: ""

credentialsSecretName: duck-server-credentials
trustSecretName: duck-server-trust

rustfs:
  endpoint: rustfs-svc.storage.svc.cluster.local:9000
  bucket: duck-server
  region: us-east-1

unityCatalog:
  endpoint: http://unitycatalog-server.tower.svc.cluster.local:8080
  catalogs:
    - name: unity
      alias: unity
      defaultSchema: demo
    - name: payments
      alias: payments
      defaultSchema: bronze
    - name: vietjet
      alias: vietjet
      defaultSchema: bronze
    - name: hdbank
      alias: hdbank
      defaultSchema: bronze
    - name: vikki
      alias: vikki
      defaultSchema: bronze
    - name: crm
      alias: crm
      defaultSchema: bronze
  introspectionUrl: https://auth.mizuumi.test/realms/sovico/protocol/openid-connect/token/introspect

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

serviceAccount:
  create: true
  automount: false
  name: ""
