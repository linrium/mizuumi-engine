apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "controlplane.serverName" . }}-config
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = {{ .Values.server.port }}

    [postgres]
    host = {{ include "controlplane.postgresqlHost" . | quote }}
    port = {{ include "controlplane.postgresqlPort" . }}
    user = {{ include "controlplane.postgresqlUsername" . | quote }}
    password = ""
    database = {{ include "controlplane.postgresqlDatabase" . | quote }}
    pool_size = 16

    [unity_catalog]
    url = {{ .Values.unityCatalog.url | quote }}
    token_url = {{ .Values.unityCatalog.tokenUrl | quote }}
    ca_certificate = {{ .Values.unityCatalog.caCertificatePath | quote }}
    client_id = ""
    client_secret = ""

    [duck_query]
    url = {{ .Values.duckQuery.url | quote }}

    [compute]
    namespace = {{ .Values.compute.namespace | quote }}
    label_selector = {{ .Values.compute.labelSelector | quote }}

    [blast_radius]
    enabled = {{ .Values.blastRadius.enabled }}
    api_key = ""
    base_url = ""
    model = ""
    timeout_ms = {{ .Values.blastRadius.timeoutMs }}
    dagster_graphql_url = {{ .Values.blastRadius.dagsterGraphqlUrl | quote }}

    [auth]
    enabled = {{ .Values.auth.enabled }}
    issuer = {{ .Values.auth.issuer | quote }}
    audience = {{ .Values.auth.audience | quote }}
    ca_certificate = {{ .Values.auth.caCertificatePath | quote }}
    bootstrap_enabled = {{ .Values.auth.bootstrapEnabled }}
    bootstrap_token_file = {{ .Values.auth.bootstrapTokenFile | quote }}
    reader_role = {{ .Values.auth.readerRole | quote }}
    writer_role = {{ .Values.auth.writerRole | quote }}
    admin_role = {{ .Values.auth.adminRole | quote }}

    [chronicle]
    enabled = {{ .Values.chronicle.enabled }}
    endpoint = {{ .Values.chronicle.endpoint | quote }}
    service_name = {{ .Values.chronicle.serviceName | quote }}
    timeout_ms = {{ .Values.chronicle.timeoutMs }}

    [signoz]
    endpoint = {{ .Values.signoz.endpoint | quote }}
    api_key = ""
    timeout_ms = {{ .Values.signoz.timeoutMs }}

