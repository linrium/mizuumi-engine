apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "controlplane.serverName" . }}-config
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = {{ .Values.server.port }}

    [postgres]
    host = {{ include "controlplane.postgresqlHost" . | quote }}
    port = {{ include "controlplane.postgresqlPort" . }}
    user = {{ include "controlplane.postgresqlUsername" . | quote }}
    password = ""
    database = {{ include "controlplane.postgresqlDatabase" . | quote }}
    pool_size = 16

