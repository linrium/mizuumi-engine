{{- if .Values.rbac.create }}
{{- $namespaces := .Values.rbac.sparkApplications.namespaces | default (list) }}
{{- $apiGroup := .Values.rbac.sparkApplications.apiGroup | default "sparkoperator.k8s.io" }}
{{- if gt (len $namespaces) 0 }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "controlplane.serverName" $ }}-sparkapps
  namespace: {{ $ns }}
  labels:
    {{- include "controlplane.labels" $ | nindent 4 }}
rules:
  - apiGroups: [{{ $apiGroup | quote }}]
    resources: ["sparkapplications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "controlplane.serverName" $ }}-sparkapps
  namespace: {{ $ns }}
  labels:
    {{- include "controlplane.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "controlplane.serverName" $ }}-sparkapps
subjects:
  - kind: ServiceAccount
    name: {{ include "controlplane.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controlplane.serverName" . }}-sparkapps
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [{{ $apiGroup | quote }}]
    resources: ["sparkapplications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controlplane.serverName" . }}-sparkapps
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "controlplane.serverName" . }}-sparkapps
subjects:
  - kind: ServiceAccount
    name: {{ include "controlplane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "controlplane.serverName" . }}-computes
  namespace: {{ .Values.compute.namespace }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "controlplane.serverName" . }}-computes
  namespace: {{ .Values.compute.namespace }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "controlplane.serverName" . }}-computes
subjects:
  - kind: ServiceAccount
    name: {{ include "controlplane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
