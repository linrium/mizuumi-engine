server:
  image:
    repository: mizuumi/controlplane-server
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  configPath: /etc/controlplane/config.toml
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

service:
  type: ClusterIP
  port: 8080

unityCatalog:
  url: http://unitycatalog-server.tower.svc.cluster.local:8080
  tokenUrl: https://keycloak.auth.svc.cluster.local:8080/realms/sovico/protocol/openid-connect/token
  caCertificatePath: /etc/controlplane/trust/keycloak-ca.crt
  credentialsSecretName: unitycatalog-credentials
  trustSecretName: controlplane-trust
  clientIdKey: CONTROLPLANE_CLIENT_ID
  clientSecretKey: CONTROLPLANE_CLIENT_SECRET

duckQuery:
  url: http://duck-server.duck-server.svc.cluster.local:9495/api/query

compute:
  namespace: duck-server
  labelSelector: app.kubernetes.io/name=duck-server

blastRadius:
  enabled: false
  credentialsSecretName: controlplane-blast-radius
  apiKeySecretKey: api-key
  baseUrlSecretKey: base-url
  modelSecretKey: model
  timeoutMs: 30000
  dagsterGraphqlUrl: http://dagster-dagster-webserver.dagster.svc.cluster.local/graphql

auth:
  enabled: true
  issuer: https://auth.mizuumi.test/realms/sovico
  audience: controlplane
  caCertificatePath: /etc/controlplane/trust/keycloak-ca.crt
  bootstrapEnabled: true
  bootstrapTokenFile: /var/run/controlplane/bootstrap-token
  readerRole: controlplane-reader
  writerRole: controlplane-writer
  adminRole: controlplane-admin

chronicle:
  enabled: true
  endpoint: http://chronicle.chronicle.svc.cluster.local
  serviceName: controlplane-server
  timeoutMs: 2000

signoz:
  endpoint: http://signoz.signoz.svc.cluster.local:8080
  apiKeySecretName: controlplane-signoz
  apiKeySecretKey: api-key
  timeoutMs: 10000

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  database: controlplane
  username: controlplane
  password: controlplane
  existingSecretName: ""
  passwordKey: password
  persistence:
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

externalPostgresql:
  host: ""
  port: 5432
  database: controlplane
  username: controlplane
  existingSecretName: ""
  passwordKey: password

serviceAccount:
  create: true
  name: ""
  automount: true

rbac:
  create: true
  sparkApplications:
    apiGroup: sparkoperator.k8s.io
    namespaces: []

