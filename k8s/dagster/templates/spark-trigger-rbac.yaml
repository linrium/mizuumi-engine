apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dagster-umbrella.sparkAccessRoleName" . }}
  namespace: {{ .Values.sparkJobNamespace | quote }}
rules:
  # Dagster launches short-lived spark-submit Jobs and observes external
  # SparkApplication and driver pod health. Pod log access is intentionally
  # omitted; Spark driver output remains available through Kubernetes itself.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "sparkapplications/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dagster-umbrella.sparkAccessRoleName" . }}
  namespace: {{ .Values.sparkJobNamespace | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dagster-umbrella.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dagster-umbrella.sparkAccessRoleName" . }}
