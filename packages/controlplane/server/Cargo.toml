[package]
name = "controlplane-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
config = "0.15"
controlplane_queries = { path = "cornucopia" }
chronicle-audit = { path = "chronicle-audit" }
deadpool-postgres = "0.14"
k8s-openapi = { version = "0.24", features = ["latest"] }
kube = { version = "0.98", default-features = false, features = ["client", "rustls-tls", "runtime"] }
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rig-agent = { version = "0.44.0", default-features = false }
rig-core = { version = "0.44.0", default-features = false, features = ["reqwest", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-postgres = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
