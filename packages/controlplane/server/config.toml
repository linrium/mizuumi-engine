[server]
host = "0.0.0.0"
port = 8080

[postgres]
host = "127.0.0.1"
port = 5432
user = "controlplane"
password = "controlplane"
database = "controlplane"
pool_size = 16

[unity_catalog]
url = "http://127.0.0.1:8081"
token_url = "http://127.0.0.1:8080/realms/sovico/protocol/openid-connect/token"
client_id = ""
client_secret = ""

[duck_query]
url = "http://127.0.0.1:9495/api/query"

[auth]
enabled = true
issuer = "https://auth.mizuumi.test/realms/sovico"
audience = "controlplane"
clock_skew_seconds = 30
bootstrap_enabled = true
bootstrap_token_file = "bootstrap-token"
reader_role = "controlplane-reader"
writer_role = "controlplane-writer"
admin_role = "controlplane-admin"

[chronicle]
enabled = false
endpoint = "http://chronicle.chronicle.svc.cluster.local"
service_name = "controlplane-server"
timeout_ms = 2000

