[server]
host = "0.0.0.0"
port = 8080

[postgres]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = "postgres"
database = "postgres"
pool_size = 16

[vending]
endpoint_url = "https://api.storage.mizuumi.test"
region = "us-east-1"
access_key = "rustfsadmin"
secret_key = "rustfsadmin"
duration_seconds = 3600
force_path_style = true

[auth]
enabled = true
issuer = "https://auth.mizuumi.test/realms/sovico"
audience = "unitycatalog"
clock_skew_seconds = 30
bootstrap_enabled = true
bootstrap_token_file = "bootstrap-token"
reader_role = "unitycatalog-reader"
writer_role = "unitycatalog-writer"
admin_role = "unitycatalog-admin"
